notes that the structure is unchanged and that windows differ, but omits mention of restored/cleaner masonry and adds specific, ungrounded details about window styling, vegetation, and sky conditions.","latency":3.469000802957453},{"model":"GEMINI","resolved":"google/gemini-3.1-pro-preview","response":"Based on the images, the most significant structural changes involve the building's windows. In Image A, the large side windows feature white, geometrically patterned grilles, whereas in Image B, they are undivided panes of dark, reflective glass. Conversely, the arched transom window above the main entrance has dark glass in Image A but displays a prominent white, fan-shaped grille in Image B. Additionally, the lower-level windows on the right side have white frames in Image A, while they appear as glass blocks in Image B, alongside expected seasonal differences in vegetation and lighting.","score":2,"label":"partially_correct","hallucinated":true,"reason":"Captures that window/entrance details differ but omits the unchanged overall structure and cleaner/restored exterior, and adds specific, unsupported structural details about window types and patterns.","latency":19.808675854001194},{"model":"CLAUDE","resolved":"anthropic/claude-sonnet-4","response":"Comparing these two images of the Carnegie Building, the most significant structural change is that the windows have been altered. In Image A, the windows have decorative geometric patterns or grillwork in the upper portions, while in Image B, these same windows appear to have plain glass without the decorative elements.\n\nThe building's overall structure, columns, entrance, and architectural details remain the same. Other differences like the seasonal vegetation, lighting conditions, and landscaping are temporary environmental changes rather than permanent structural modifications.","score":2,"label":"partially_correct","hallucinated":true,"reason":"The answer correctly notes that the overall structure is unchanged and focuses on window differences while handling environmental changes properly, but it overstates a specific structural alteration to the windows that is not supported by the ground truth and omits mention of the cleaner/restored exterior.","latency":9.261291267932393},{"model":"QWEN","resolved":"qwen/qwen3-vl-235b-a22b-instruct","response":"The building’s structure is identical in both images, with no visible renovations or physical alterations. The key differences are environmental: Image A shows a clear, sunny day with lush green trees and bright lighting, while Image B depicts an overcast day with bare trees, muted colors, and visible flowerbeds with yellow and white blooms. The framing and perspective are nearly identical, suggesting the same vantage point, but lighting and seasonal vegetation create distinct moods. No persistent structural changes are evident.","score":1,"label":"incorrect","hallucinated":true,"reason":"The response correctly notes that the overall structure is unchanged and focuses on environmental differences, but it incorrectly denies any visible renovations or alterations and omits the expected restoration changes to windows/doors and masonry appearance.","latency":10.658616586006247},{"model":"GEMMA","resolved":"google/gemma-3-27b-it","response":"The most noticeable difference between the two images is the weather and resulting lighting conditions; Image A is taken on a bright, sunny day while Image B appears overcast. Consequently, the shadows and vibrancy of colors differ significantly between the images. Additionally, the vegetation around the building is fuller and more lush in Image B, suggesting a different time of year. No persistent physical or structural changes to the building itself are visible.","score":2,"label":"partially_correct","hallucinated":false,"reason":"Response correctly notes no structural change and focuses on transient factors but fails to mention the restoration-related changes to windows/doors and cleaner masonry that are central to the ground truth.","latency":4.972022388014011},{"model":"LLAMA","resolved":"meta-llama/llama-4-maverick","response":"The most notable differences between the two images are the sky conditions and the state of the vegetation. Image A features a clear blue sky, while Image B has an overcast sky. Additionally, the trees and bushes in Image A appear more lush and green, whereas in Image B, some of the trees are bare, indicating a different season or time of year. The lighting and shadows also vary between the two images due to the different sky conditions.","score":2,"label":"partially_correct","hallucinated":false,"reason":"The response only discusses sky, vegetation, and lighting differences and does not address the required restoration-related changes to windows/doors and masonry, though it correctly treats these as transient conditions rather than structural changes.","latency":5.708526128088124},{"model":"MISTRAL","resolved":"mistralai/mistral-small-3.2-24b-instruct","response":"The most notable differences between the two images are the environmental and seasonal conditions. In Image A, the weather is clear and sunny, with bright lighting and green vegetation, while in Image B, the sky is overcast, and the trees are bare, indicating a different season, likely winter. Additionally, the flowers in the foreground of Image B are not visible in Image A, suggesting a seasonal change. There are no visible structural or physical changes to the building itself.","score":1,"label":"incorrect","hallucinated":true,"reason":"The response incorrectly states there are no physical changes and instead invents detailed seasonal and environmental differences not supported by the ground truth, while correctly avoiding claims of major structural alteration.","latency":7.018759931088425},{"model":"KIMI","resolved":"moonshotai/kimi-k2.5","response":"The windows have been replaced: Image A features decorative white lattice windows, while Image B has large plain glass windows without the lattice. The entrance door has also been modified from the dark glass door in Image A to a white-framed door with a fanlight window in Image B. Seasonal differences are also visible, with Image B showing bare trees and flower beds compared to Image A's leafy trees.","score":2,"label":"partially_correct","hallucinated":true,"reason":"Captures that openings changed and notes seasonal differences, but omits the unchanged overall structure and cleaner masonry, and adds detailed, unsupported descriptions of window and door styles.","latency":67.36705568502657}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('payload').textContent); const deck=document.getElementById('deck');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_');
const all=D.cases.flatMap(c=>c.answers); const mean=xs=>xs.reduce((a,b)=>a+b,0)/xs.length;
const summary=D.models.map(m=>{const a=all.filter(x=>x.model===m);return {m,score:mean(a.map(x=>x.score)),correct:a.filter(x=>x.label==='correct').length,hall:a.filter(x=>x.hallucinated).length,lat:mean(a.map(x=>x.latency))}}).sort((a,b)=>b.score-a.score);
function footer(n){return '<div class="footer"><span>MapEvolve • VLM routing pilot</span><span>'+n+'</span></div>'}
function add(html){deck.insertAdjacentHTML('beforeend',html)}
add('<section class="slide active"><div class="hero-grid"><div><div class="kicker">Visual QA benchmark · 6 paired-image cases · 48 judged responses</div><div class="title">Route the query.<br><em>Not every image question needs a frontier model.</em></div><p class="lede">A compact comparison of model answers on “What changed between these two images?”—and the evidence for routing easy queries to smaller VLMs while reserving SoTA capacity for hard visual change detection.</p><div class="source">Source: benchmark/runs/judge_results.jsonl · judge: GPT-5.1 · scores are 0–4 final totals</div></div><div class="hero-mark">↗<br>VLM</div></div>'+footer('01')+'</section>');
add('<section class="slide"><div class="kicker">The signal</div><h2>Difficulty is the routing feature.</h2><p>The same prompt spans “no meaningful change” through subtle historical/structural change. Performance separates cleanly by case difficulty.</p><div class="cards"><div class="card"><strong>3.63 / 4</strong><h3>Easy mean</h3><small>14 of 16 responses fully correct</small></div><div class="card"><strong>3.25 / 4</strong><h3>Medium mean</h3><small>Real changes mixed with snow, water, or crowds</small></div><div class="card"><strong>1.44 / 4</strong><h3>Hard mean</h3><small>0 of 16 fully correct; 12 hallucinated-change flags</small></div></div><div class="callout"><b>Routing thesis:</b> use a small/fast VLM for easy visual comparisons; escalate when the query looks like persistent change, historical context, or fine-grained structural reasoning.</div>'+footer('02')+'</section>');
const maxScore=Math.max(...summary.map(x=>x.score));
add('<section class="slide"><div class="kicker">Model comparison</div><h2>Smaller models can cover the easy lane.</h2><p>Overall averages blur the operational choice. The more useful view is: which models are dependable before the router escalates?</p><div class="two"><div class="card"><h3>Mean final score · all 6 cases</h3>'+summary.map(x=>'<div class="bar-row"><span>'+esc(x.m)+'</span><div class="bar"><i style="width:'+(x.score/4*100)+'%"></i></div><b>'+x.score.toFixed(2)+'</b></div>').join('')+'</div><div class="card"><h3>Full correctness · 6 cases</h3>'+summary.map(x=>'<div class="bar-row"><span>'+esc(x.m)+'</span><div class="bar orange"><i style="width:'+(x.correct/6*100)+'%"></i></div><b>'+x.correct+'/6</b></div>').join('')+'<p class="note">Mistral, Qwen, Gemma, and Llama all reached 4/6 or better in this pilot—but that does not mean they should see hard cases.</p></div></div>'+footer('03')+'</section>');
add('<section class="slide"><div class="kicker">Failure mode</div><h2>Hard cases trigger confident-looking mistakes.</h2><div class="two"><div class="card"><h3>Hallucination flags by case</h3>'+D.cases.map(c=>{const a=c.answers;const h=a.filter(x=>x.hallucinated).length;return '<div class="bar-row"><span><b>'+c.case_id+'</b> · '+c.difficulty+'</span><div class="bar orange"><i style="width:'+(h/8*100)+'%"></i></div><b>'+h+'/8</b></div>'}).join('')+'</div><div class="card"><h3>What the hard cases demand</h3><ul style="font-size:17px;line-height:1.8"><li><b>H1:</b> distinguish campus-wide structural change from a recognizable central building.</li><li><b>H2:</b> report changed openings and cleaner masonry without inventing window/door details.</li><li>Models often mention a true visual cue, then overreach with an unsupported permanent change.</li></ul></div></div><div class="callout"><b>Safety implication:</b> the router should optimize for error cost, not only mean score. A false structural-change claim is more damaging than a cautious “no clear permanent change.”</div>'+footer('04')+'</section>');
add('<section class="slide"><div class="kicker">Recommended architecture</div><h2>A two-lane router with an escalation guard.</h2><div class="router"><div class="route-line"><div class="route-box">Input query + image pair</div><span class="arrow">→</span><div class="route-box">Difficulty / ambiguity classifier</div></div><div class="route-line"><div class="route-box">Easy: same viewpoint, obvious/no change</div><span class="arrow">→</span><div class="route-box">Small VLM<br><small>Gemma · Llama · Mistral</small></div></div><div class="route-line"><div class="route-box">Medium / hard: persistent change, historical context, fine detail</div><span class="arrow">→</span><div class="route-box">SoTA VLM<br><small>frontier vision · Gemini · Claude</small></div></div></div><div class="three" style="margin-top:22px"><div class="card"><h3>Route down</h3><p>Aligned viewpoint, no obvious object-level change, low ambiguity.</p></div><div class="card"><h3>Route up</h3><p>Architecture, restoration, openings, scene history, or subtle persistent change.</p></div><div class="card"><h3>Verify</h3><p>Ask for a confidence/uncertainty signal; escalate if the small model flags a structural change.</p></div></div><p class="note">This is a routing hypothesis from a six-case pilot, not a statistically powered claim. Validate on a larger held-out set.</p>'+footer('05')+'</section>');
add('<section class="slide"><div class="kicker">Evidence · case walkthroughs</div><h2>Every judgment starts with the same query.</h2><p>Use the buttons to jump to a case. Each case preserves the image pair, the input text, the reference expectation, and every model answer with its correctness label.</p><div class="toc">'+D.cases.map(c=>'<button data-go="case_'+c.case_id+'">'+c.case_id+' · '+c.difficulty+'</button>').join('')+'</div><div class="card"><h3>Reading the labels</h3><p><span class="pill correct">correct</span> meets the rubric without unsupported claims &nbsp; <span class="pill partially_correct">partial</span> captures some change but omits or adds material detail &nbsp; <span class="pill incorrect">incorrect</span> misses the required distinction.</p></div>'+footer('06')+'</section>');
D.cases.forEach((c,i)=>{const gt=c.ground_truth_raw.replace(/^.*?Ground truth:\s*/s,'').split(/\nExpected/)[0]; add('<section class="slide" id="case_'+c.case_id+'"><div class="case-head"><div><div class="kicker">Case '+c.case_id+' · '+c.difficulty+'</div><h2>'+c.difficulty.toUpperCase()+' visual change</h2><p><b>Input text query:</b> “'+esc(c.question)+'”</p></div><span class="pill '+c.difficulty+'">'+c.difficulty+'</span></div><div class="pair"><figure class="photo"><img src="../benchmark/'+esc(c.image_a)+'"><figcaption>Image A · '+esc(c.case_id)+'</figcaption></figure><figure class="photo"><img src="../benchmark/'+esc(c.image_b)+'"><figcaption>Image B · '+esc(c.case_id)+'</figcaption></figure></div><div class="gt"><h3>Reference expectation</h3><p>'+esc(gt)+'</p></div><div class="answers">'+c.answers.sort((a,b)=>b.score-a.score).map(a=>'<article class="answer"><div class="answer-top"><span class="model">'+esc(a.model)+'</span><span><span class="pill '+slug(a.label)+'">'+esc(a.label.replace('_',' '))+'</span> <b>'+a.score+'/4</b></span></div><blockquote>“'+esc(a.response)+'”</blockquote><details><summary>Judge rationale</summary><p>'+esc(a.reason)+'</p><small>latency: '+a.latency.toFixed(1)+'s'+(a.hallucinated?' · unsupported-change flag':'' )+'</small></details></article>').join('')+'</div>'+footer(String(7+i).padStart(2,'0'))+'</section>');});
add('<section class="slide"><div class="kicker">Takeaway</div><h2>Spend intelligence where ambiguity lives.</h2><p class="lede">The benchmark does not say that smaller VLMs are universally better. It says the task has lanes—and the lane is visible in the query and image pair.</p><div class="cards"><div class="card"><strong>Easy</strong><h3>Fast path</h3><p>Small VLM answers aligned, low-ambiguity comparisons at lower latency and cost.</p></div><div class="card"><strong>Hard</strong><h3>Escalation path</h3><p>SoTA VLM gets the cases where “what changed?” requires resisting plausible but unsupported structural stories.</p></div><div class="card"><strong>Guardrail</strong><h3>Abstain or verify</h3><p>When uncertainty is high, ask for a second pass rather than silently accepting a confident hallucination.</p></div></div><div class="callout"><b>Next experiment:</b> train/evaluate a router on more paired images, then measure cost-weighted accuracy and hallucination rate at the chosen escalation threshold.</div>'+footer('13')+'</section>');
const slides=[...document.querySelectorAll('.slide')];let idx=0;function show(n){idx=(n+slides.length)%slides.length;slides.forEach((s,i)=>s.classList.toggle('active',i===idx));document.getElementById('counter').textContent=(idx+1)+' / '+slides.length;document.querySelectorAll('.toc button').forEach(b=>b.classList.toggle('active',b.dataset.go===slides[idx].id));slides[idx].scrollTop=0}function goId(id){const n=slides.findIndex(s=>s.id===id);if(n>=0)show(n)}document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goId(b.dataset.go));show(0);
