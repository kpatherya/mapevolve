# Static, hand-maintained model configuration for Jev adaptive routing.
#
# Only the eight VLM slots that were actually evaluated in the pilot benchmark
# (benchmark/config/models.yaml + benchmark/artifacts/resolved_models.json) are
# listed. Model IDs are copied verbatim from those artifacts; nothing is invented.
#
# Dynamic fields (current pricing, modalities, listing status, latency and
# evaluation scores) are NOT written here. They are merged in by
#   python -m scripts.build_registry
# which writes config/model_registry.json.

models:
  - key: OPENAI_FRONTIER_VISION
    display_name: GPT-5.1 (direct OpenAI API)
    backend: openai                     # -> ChatOpenAI
    model_id: gpt-5.1                    # requested id used in the benchmark
    resolved_model_id: gpt-5.1-2025-11-13  # snapshot the API returned
    provider: openai
    # Direct OpenAI pricing is not available from a public API. The registry
    # builder uses the OpenRouter listing of the same model as a reference and
    # labels it as such.
    pricing_reference_openrouter_id: openai/gpt-5.1
    benchmark_two_image_smoke_test: pass
    max_images: 2                        # largest image count actually tested
    # GPT-5.x accepts temperature != 1 only with reasoning effort "none"
    # (GPT-5.1's default). Without this, langchain-openai silently drops
    # temperature=0, breaking parity with the other models.
    chat_kwargs:
      reasoning_effort: none

  - key: GEMINI
    display_name: Gemini 3.1 Pro Preview
    backend: openrouter                  # -> ChatOpenRouter
    model_id: google/gemini-3.1-pro-preview
    provider: google
    benchmark_two_image_smoke_test: pass
    max_images: 2
    # Hidden reasoning consumed the 350-token budget in every benchmark case;
    # the benchmark retried with 4096. Same override is applied here.
    max_output_tokens: 4096

  - key: CLAUDE
    display_name: Claude Sonnet 4
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    provider: anthropic
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: QWEN
    display_name: Qwen3-VL 235B A22B Instruct
    backend: openrouter
    model_id: qwen/qwen3-vl-235b-a22b-instruct
    provider: qwen
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: GEMMA
    display_name: Gemma 3 27B IT
    backend: openrouter
    model_id: google/gemma-3-27b-it
    provider: google
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: LLAMA
    display_name: Llama 4 Maverick
    backend: openrouter
    model_id: meta-llama/llama-4-maverick
    provider: meta-llama
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: MISTRAL
    display_name: Mistral Small 3.2 24B Instruct
    backend: openrouter
    model_id: mistralai/mistral-small-3.2-24b-instruct
    provider: mistralai
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: KIMI
    display_name: Kimi K2.5
    backend: openrouter
    model_id: moonshotai/kimi-k2.5
    provider: moonshotai
    benchmark_two_image_smoke_test: pass
    max_images: 2
    max_output_tokens: 4096
    notes: >-
      The benchmark requested moonshotai/kimi-vl-a3b-thinking, which was
      unavailable or not image-capable; the benchmark substituted
      moonshotai/kimi-k2.5. All KIMI scores refer to kimi-k2.5.
