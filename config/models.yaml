# Static, hand-maintained model configuration for Jev adaptive routing.
#
# The first eight slots are the VLMs evaluated in the pilot benchmark
# (benchmark/config/models.yaml + benchmark/artifacts/resolved_models.json);
# their IDs are copied verbatim from those artifacts. The "round 1 pool" below
# them was added 2026-11-13 from the live OpenRouter catalog (IDs and prices
# checked there) to span size, cost and reasoning tiers, mostly open-weight.
# A model is excluded from routing until it has graded answers.
#
# Dynamic fields (current pricing, modalities, listing status, latency and
# evaluation scores) are NOT written here. They are merged in by
#   python -m scripts.build_registry
# which writes config/model_registry.json.

models:
  - key: OPENAI_FRONTIER_VISION
    display_name: GPT-5.1 (direct OpenAI API)
    backend: openai                     # -> ChatOpenAI
    model_id: gpt-5.1                    # requested id used in the benchmark
    resolved_model_id: gpt-5.1-2025-11-13  # snapshot the API returned
    provider: openai
    # Direct OpenAI pricing is not available from a public API. The registry
    # builder uses the OpenRouter listing of the same model as a reference and
    # labels it as such.
    pricing_reference_openrouter_id: openai/gpt-5.1
    benchmark_two_image_smoke_test: pass
    max_images: 2                        # largest image count actually tested
    # GPT-5.x accepts temperature != 1 only with reasoning effort "none"
    # (GPT-5.1's default). Without this, langchain-openai silently drops
    # temperature=0, breaking parity with the other models.
    chat_kwargs:
      reasoning_effort: none

  - key: GEMINI
    display_name: Gemini 3.1 Pro Preview
    backend: openrouter                  # -> ChatOpenRouter
    model_id: google/gemini-3.1-pro-preview
    provider: google
    benchmark_two_image_smoke_test: pass
    max_images: 2
    # Hidden reasoning consumed the 350-token budget in every benchmark case;
    # the benchmark retried with 4096. Same override is applied here.
    max_output_tokens: 4096

  - key: CLAUDE
    display_name: Claude Sonnet 4
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    provider: anthropic
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: QWEN
    display_name: Qwen3-VL 235B A22B Instruct
    backend: openrouter
    model_id: qwen/qwen3-vl-235b-a22b-instruct
    provider: qwen
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: GEMMA
    display_name: Gemma 3 27B IT
    backend: openrouter
    model_id: google/gemma-3-27b-it
    provider: google
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: LLAMA
    display_name: Llama 4 Maverick
    backend: openrouter
    model_id: meta-llama/llama-4-maverick
    provider: meta-llama
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: MISTRAL
    display_name: Mistral Small 3.2 24B Instruct
    backend: openrouter
    model_id: mistralai/mistral-small-3.2-24b-instruct
    provider: mistralai
    benchmark_two_image_smoke_test: pass
    max_images: 2

  - key: KIMI
    display_name: Kimi K2.5
    backend: openrouter
    model_id: moonshotai/kimi-k2.5
    provider: moonshotai
    benchmark_two_image_smoke_test: pass
    max_images: 2
    max_output_tokens: 4096
    notes: >-
      The benchmark requested moonshotai/kimi-vl-a3b-thinking, which was
      unavailable or not image-capable; the benchmark substituted
      moonshotai/kimi-k2.5. All KIMI scores refer to kimi-k2.5.

  # ---------------------------------------------------------------- round 1 pool (2026-11-13)
  # Two-image support is verified by the smoke test, not assumed.
  - key: GEMMA3_4B
    display_name: Gemma 3 4B
    backend: openrouter
    model_id: google/gemma-3-4b-it
    provider: google
    tier: tiny
    open_weight: true
    max_images: 2

  - key: MINISTRAL_3B
    display_name: Ministral 3 3B
    backend: openrouter
    model_id: mistralai/ministral-3b-2512
    provider: mistralai
    tier: tiny
    open_weight: true
    max_images: 2

  - key: QWEN3_VL_8B
    display_name: Qwen3-VL 8B Instruct
    backend: openrouter
    model_id: qwen/qwen3-vl-8b-instruct
    provider: qwen
    tier: small
    open_weight: true
    max_images: 2

  - key: QWEN3_VL_30B
    display_name: Qwen3-VL 30B-A3B Instruct
    backend: openrouter
    model_id: qwen/qwen3-vl-30b-a3b-instruct
    provider: qwen
    tier: mid
    open_weight: true
    max_images: 2

  - key: GEMMA4_31B
    display_name: Gemma 4 31B
    backend: openrouter
    model_id: google/gemma-4-31b-it
    provider: google
    tier: mid
    open_weight: true
    max_images: 2

  # (qwen/qwen3-vl-30b-a3b-thinking was considered; OpenRouter retires it 2026-11-15.)
  - key: NEMOTRON_VL
    display_name: Nemotron 3.5 Super VL
    backend: openrouter
    model_id: nvidia/nemotron-3.5-super-vl
    provider: nvidia
    tier: reasoning
    open_weight: unverified         # check NVIDIA's licence before calling it open
    max_images: 2
    max_output_tokens: 8192         # reasoning shares the output budget (see KIMI)

  - key: GLM_4_6V
    display_name: GLM-4.6V
    backend: openrouter
    model_id: z-ai/glm-4.6v
    provider: z-ai
    tier: reasoning
    open_weight: true
    max_images: 2
    max_output_tokens: 8192

  - key: QWEN25_VL_72B
    display_name: Qwen2.5-VL 72B Instruct
    backend: openrouter
    model_id: qwen/qwen2.5-vl-72b-instruct
    provider: qwen
    tier: large
    open_weight: true
    max_images: 2

  # moondream/moondream3.1-9b-a2b was smoke-tested 2026-11-13 and removed: it
  # returned the prompt template's placeholder ("2-5 sentence answer") with
  # confidence 0, so it cannot follow the shared structured prompt.
