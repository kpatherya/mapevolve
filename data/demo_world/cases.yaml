# World-landmark demo cases (non-Georgia-Tech). Built into
# datasets/demo_world.json by `python -m scripts.build_demo_manifest`.
#
# References were drafted by Claude after viewing each image and are marked
# labels.author = draft_by_claude, reviewed = false. They need human review
# before being treated as ground truth.
#
# Split is assigned per location in the builder (TEST_LOCATIONS).
# Images are referenced by id from sources.yaml.

defaults:
  q_change: "What changed between these two images?"
  q_same: "Do these two photos show the same building or landmark (possibly from a different viewpoint, distance, time of day, or one inside and one outside)? Answer yes or no, then give the visual evidence."
  q_identify: "What building or landmark is this? Name it and give the visual evidence."

cases:
  # ===================== temporal_comparison =====================
  - id: T-nd-spire
    location: notre-dame
    type: temporal_comparison
    difficulty: moderate
    images: [nd_2018_south, nd_2020_works]
    question: q_change
    answer: >-
      Both images show Notre-Dame de Paris from its south/south-east side, from different
      viewpoints. In Image A the slender central spire rises above the crossing; in Image B the
      spire is absent and a tall construction crane stands beside the cathedral, indicating works
      on the roof. The two west towers are present in both.
    required_points:
      - The central spire visible in Image A is absent in Image B.
      - A construction crane / works are visible in Image B.
      - The west towers remain.
    confounders: [Different camera position, Different foreground garden and trees, Season and lighting]
    avoid:
      - Stating the cause of the spire's absence (e.g. a fire) as if it were visible.
      - Claiming the towers or facade collapsed.
      - Specific dates or events not shown in the images.

  - id: T-nd-hoarding
    location: notre-dame
    type: temporal_comparison
    difficulty: moderate
    images: [nd_2020_west, nd_2025_west]
    question: q_change
    answer: >-
      Same frontal view of the west facade. The towers, rose window, gallery and portals show no
      structural change. In Image A a white construction hoarding lines the forecourt at the base
      and a crane arm is visible at the right edge; in Image B the hoarding is gone and a dense
      crowd fills the forecourt.
    required_points:
      - No structural change to the west facade.
      - Construction hoarding at the base in Image A, absent in Image B.
      - Crowd present in Image B.
    confounders: [Crowd, Sky and lighting, Stone may look lighter in Image B]
    avoid: [Invented changes to towers, portals or windows, Unsupported claims about cleaning or restoration details]

  - id: T-nd-1890
    location: notre-dame
    type: temporal_comparison
    difficulty: hard
    images: [nd_1890_photochrom, nd_2025_west]
    question: q_change
    answer: >-
      Same cathedral from very different viewpoints and eras. Image A is a toned archival print
      from the south-west across the river showing the west towers and the central spire; Image B
      is a modern frontal view of the west facade with a crowd. The west towers, rose window and
      three portals match. The spire cannot be compared because it is not visible from Image B's
      viewpoint. Colour differences reflect the photographic process, not architectural change.
    required_points:
      - The west facade elements correspond.
      - The viewpoints differ, so some parts (spire, south side) cannot be compared.
      - Colour/tone differences come from the archival process.
    confounders: [Archival toning, Viewpoint, Crowd]
    avoid: [Claiming the spire was removed or destroyed, Claiming the stone changed colour, Dates or events]

  - id: T-fk-rebuilt
    location: frauenkirche
    type: temporal_comparison
    difficulty: moderate
    images: [fk_1994_ruin, fk_2015_evening]
    question: q_change
    answer: >-
      Image A shows a ruin: two tall fragments of sandstone walls standing on a construction site
      with a crane, fencing and information boards. Image B shows a complete domed Baroque church
      with a bell-shaped stone dome and lantern. The site has been rebuilt from a ruin into a
      complete building.
    required_points:
      - Image A shows ruined wall fragments and a construction site.
      - Image B shows a complete domed church.
    confounders:
      - "A different dome-topped building in the background of Image A is not the church itself (reviewer: verify)."
      - Different viewpoint and lighting.
    avoid: [Claiming the background dome in Image A is the church's dome, Dates of destruction or reconstruction]

  - id: T-fk-lighting
    location: frauenkirche
    type: temporal_comparison
    difficulty: moderate
    images: [fk_2015_evening, fk_2015_night]
    question: q_change
    answer: >-
      No structural change. The same domed church is shown in daylight (Image A) and at night
      under floodlighting with wet, reflective paving (Image B). Image B is framed more widely and
      shows neighbouring buildings.
    required_points: [No structural change, Day versus night lighting, Different framing]
    confounders: [Floodlighting, Wet pavement, People]
    avoid: [Invented changes to dome, windows or facade]

  - id: T-bt-same-day
    location: berlin
    type: temporal_comparison
    difficulty: easy
    images: [bt_2019_b, bt_2019_c]
    question: q_change
    answer: >-
      Nothing meaningful changed. Both show the Brandenburg Gate the same day from nearby camera
      positions; Image A is framed by tree trunks on either side. People and vehicles differ.
    required_points: [No change to the gate]
    confounders: [Framing, Trees, People]
    avoid: [Any invented architectural change]

  - id: T-bt-1989
    location: berlin
    type: temporal_comparison
    difficulty: hard
    images: [bt_1989_wall, bt_2019_c]
    question: q_change
    answer: >-
      The gate's columns, entablature and quadriga appear unchanged. Image A is a close,
      older-looking photograph with a dense crowd directly in front of the gate and a flag above
      the quadriga; Image B is a wider modern view with an open plaza, bollards and few people. No
      structural change to the gate itself is visible.
    required_points: [The gate structure is unchanged, Crowd in Image A versus open plaza in Image B]
    confounders: [Film-era colour, Viewpoint, Crowd]
    avoid:
      - Claims about the Berlin Wall's removal unless a wall is actually visible.
      - Historical events or dates.

  - id: T-rt-1985
    location: berlin
    type: temporal_comparison
    difficulty: hard
    images: [rt_1985_wall, rt_2022_west]
    question: q_change
    answer: >-
      Image A is a black-and-white close view of one corner tower of the Reichstag building with a
      wall-like barrier and an adjacent building in the foreground; Image B is a colour view of the
      whole west facade with a glass dome over the centre and a lawn in front. The corner-tower
      architecture matches. Image A's framing does not show the centre of the roof, so it does not
      establish whether a dome was present then.
    required_points:
      - The corner-tower architecture corresponds.
      - The glass dome is visible in Image B.
      - Image A cannot show whether a dome existed.
    confounders: [Monochrome, Very different framing]
    avoid: [Asserting the dome was absent in Image A, Dates or political history]

  - id: T-et-construction
    location: eiffel
    type: temporal_comparison
    difficulty: moderate
    images: [et_1888_construction, et_2011_champ_de_mars]
    question: q_change
    answer: >-
      Image A is a sepia archival photograph of the tower under construction: the lower levels and
      a partly built upper shaft stand on open ground with no summit. Image B shows the completed
      tower with its full upper section and antenna, with trees and lawns around the base.
    required_points: [Image A is unfinished (no summit), Image B is complete, Surroundings are now landscaped]
    confounders: [Sepia tone, Viewpoint]
    avoid: [Treating the colour difference as a paint change]

  - id: T-sf-1905
    location: sagrada-familia
    type: temporal_comparison
    difficulty: hard
    images: [sf_1905, sf_2022_exterior]
    question: q_change
    answer: >-
      Image A is an early black-and-white photograph: a partly built church with a cluster of tall
      spires and scaffolding stands beyond an open field, with two men in the foreground. Image B
      shows the same church far larger and more complete, with many more towers, construction
      cranes, and a dense urban and planted surrounding. The viewpoints differ substantially.
    required_points: [Far more of the building exists in Image B, Open field versus urban surroundings, Construction is ongoing in Image B]
    confounders: [Monochrome, People, Viewpoint]
    avoid: [Precise tower counts or dates not supported by the images]

  - id: T-wm-scaffold
    location: westminster
    type: temporal_comparison
    difficulty: moderate
    images: [wm_2018_night_scaffold, wm_2024_square]
    question: q_change
    answer: >-
      Image A shows the clock tower wrapped in scaffolding at night, with an ornate street lamp in
      the foreground. Image B shows the same tower in daylight without scaffolding, seen from a
      street with a crowd. The scaffolding has been removed; lighting and viewpoint also differ.
    required_points: [Scaffolding in Image A, No scaffolding in Image B]
    confounders: [Night versus day, Foreground lamp, Crowd, Viewpoint]
    avoid: [Detailed claims about clock-face changes, Renovation details not visible]

  - id: T-co-night
    location: colosseum
    type: temporal_comparison
    difficulty: easy
    images: [co_night_a, co_night_b]
    question: q_change
    answer: >-
      No structural change. Both are black-and-white night photographs of the Colosseum from
      different positions; Image B is closer and shows the taller intact section of the outer wall.
    required_points: [No structural change, Different viewpoint]
    confounders: [Viewpoint, People]
    avoid: [Invented damage or restoration]

  # ===================== cross_view_matching =====================
  - id: C-nd-2014
    location: notre-dame
    type: cross_view_matching
    difficulty: moderate
    images: [nd_2014_a, nd_2014_b]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes. Both show the same Gothic cathedral's slender central spire with surrounding pinnacles;
      Image A is a wider low view including a transept rose window and trees, Image B a closer view
      of the spire and its statues.
    required_points: [Yes, The spire and pinnacles correspond]
    avoid: [Claiming a different building]

  - id: C-fk-interior
    location: frauenkirche
    type: cross_view_matching
    difficulty: hard
    images: [fk_2015_dome_interior, fk_2015_day]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes (the Dresden Frauenkirche), but the visual link is weak: Image A looks up into a painted
      circular dome above tiers of galleries; Image B shows a church with a single large central
      stone dome. A careful answer can say "plausibly yes" and state that interior-to-exterior
      evidence is limited.
    required_points: [A circular central dome in both is the main link, Acknowledges limited evidence]
    avoid: [Overconfident matching on generic church features]

  - id: C-pa-interior
    location: pantheon
    type: cross_view_matching
    difficulty: hard
    images: [pa_interior, pa_portico]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes, the Pantheon in Rome. Image A is the coffered concrete dome with a central oculus; Image
      B is the columned portico whose frieze inscription reads "M AGRIPPA L F COS TERTIVM FECIT".
      Both are distinctive parts of the same building.
    required_points: [Yes, Coffered dome with oculus, Portico with the Agrippa inscription]
    avoid: [Calling the dome a different building]

  - id: C-taj-bibi
    location: taj-bibi
    type: cross_view_matching
    difficulty: hard
    hard_negative: true
    images: [tm_south, bkm_01]
    question: q_same
    action: verify_then_answer
    answer: >-
      No. Image A is the Taj Mahal (long reflecting pool, cypress rows, white marble tomb with four
      minarets). Image B is a similar-looking but different tomb, Bibi Ka Maqbara in Aurangabad: its
      main building is smaller relative to its minarets, sits on a high platform, and has a duller
      plaster-like finish.
    required_points: ["No", Identifies the look-alike, Cites proportion or material differences]
    avoid: [Calling them the same building because of similar layout]

  - id: C-hs-sam
    location: istanbul
    type: cross_view_matching
    difficulty: hard
    hard_negative: true
    images: [hs_2013_a, sam_2022]
    question: q_same
    action: verify_then_answer
    answer: >-
      No. Image A is Hagia Sophia (reddish-pink walls, heavy buttressed mass, broad central dome,
      minarets of differing designs). Image B is the Sultan Ahmed (Blue) Mosque (grey cascading
      domes and slender, matching pencil minarets).
    required_points: ["No", Distinguishes wall colour or buttressing from cascading grey domes]
    avoid: [Treating any domed mosque with minarets as the same building]

  - id: C-hs-day-night
    location: istanbul
    type: cross_view_matching
    difficulty: moderate
    images: [hs_2013_b, hs_2013_a]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes, Hagia Sophia. Image A is a floodlit blue-hour view from ground level; Image B is a
      daytime elevated view. The domes, buttressed mass and reddish walls correspond.
    required_points: ["Yes", Lighting difference is not evidence of a different building]
    avoid: [Calling them different because of lighting]

  - id: C-wm-two-views
    location: westminster
    type: cross_view_matching
    difficulty: moderate
    images: [wm_2025_river, wm_2024_square]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes. Image A shows the Palace of Westminster across the river with the clock tower at its
      right end; Image B shows that clock tower close up from a street. The tower's spire, clock
      faces and Gothic detailing match.
    required_points: ["Yes", Clock tower correspondence]
    avoid: [Confusing the clock tower with the larger square tower at the other end]

  - id: C-so-day-night
    location: sydney
    type: cross_view_matching
    difficulty: easy
    images: [so_2008, so_2023_southeast]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes, the Sydney Opera House: the same sail-shaped shell roofs are seen at night in Image A
      and by day, with the Harbour Bridge behind, in Image B.
    required_points: ["Yes", Shell roofs]
    avoid: []

  - id: C-co-day-night
    location: colosseum
    type: cross_view_matching
    difficulty: moderate
    images: [co_day, co_night_b]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes, the Colosseum. Both are black-and-white: Image A is a daytime wide-angle view, Image B a
      floodlit night view. The tiers of arches and the stepped profile of the outer wall
      correspond.
    required_points: ["Yes", Tiers of arches]
    avoid: [Treating wide-angle distortion as a different structure]

  - id: C-sf-interior
    location: sagrada-familia
    type: cross_view_matching
    difficulty: hard
    images: [sf_2023_nave, sf_2022_tall]
    question: q_same
    action: verify_then_answer
    answer: >-
      Yes, the Sagrada Família. Image A shows the interior nave with branching tree-like columns and
      coloured light; Image B shows a richly sculpted facade with tall spires. The link rests on
      recognising the building, not on directly shared features.
    required_points: ["Yes", Acknowledges the interior/exterior link is recognition-based]
    avoid: [Claiming shared features that are not visible]

  # ===================== landmark_identification =====================
  - {id: L-co, location: colosseum, type: landmark_identification, difficulty: easy, images: [co_forum], question: q_identify,
     answer: "The Colosseum in Rome: an elliptical amphitheatre with tiers of arches, partly collapsed outer wall, beside Roman ruins and cypress trees.",
     required_points: [Colosseum], avoid: []}
  - {id: L-so, location: sydney, type: landmark_identification, difficulty: easy, images: [so_2019_dusk], question: q_identify,
     answer: "The Sydney Opera House (sail-shaped shell roofs) with the Sydney Harbour Bridge behind it, at dusk.",
     required_points: [Sydney Opera House], avoid: []}
  - {id: L-cb, location: casa-batllo, type: landmark_identification, difficulty: easy, images: [cb_2013_facade], question: q_identify,
     answer: "Casa Batlló in Barcelona: undulating bone-like stone balconies, mosaic-tiled facade, and shop-window signs that read 'CASA BATLLÓ' with house number 43.",
     required_points: [Casa Batlló, Uses the visible signage],
     avoid: ["Casa Milà (the Commons file title is wrong)"],
     tags: [source_label_error]}
  - {id: L-bkm, location: taj-bibi, type: landmark_identification, difficulty: hard, images: [bkm_02], question: q_identify,
     answer: "Bibi Ka Maqbara in Aurangabad, India: a Mughal tomb that closely resembles the Taj Mahal but is smaller, with a plaster finish, seen at the end of a long walkway.",
     required_points: [Bibi Ka Maqbara, or a hedged answer noting it resembles but is not the Taj Mahal],
     avoid: [Taj Mahal]}
  - {id: L-fi, location: flatiron, type: landmark_identification, difficulty: hard, images: [fi_1903], question: q_identify,
     answer: "The Flatiron Building in New York: a narrow triangular skyscraper at a street fork, shown in an early black-and-white photograph with horse-drawn traffic.",
     required_points: [Flatiron Building], avoid: [A specific year]}
  - {id: L-pa-oculus, location: pantheon, type: landmark_identification, difficulty: moderate, images: [pa_oculus], question: q_identify,
     answer: "The interior of the Pantheon's dome in Rome: concentric rings of square coffers around a single open oculus.",
     required_points: [Pantheon], avoid: []}
  - {id: L-nd-sculpture, location: notre-dame, type: landmark_identification, difficulty: hard, images: [nd_2017_sculptures], question: q_identify,
     answer: "A detail of a Gothic rose window with statues of the Virgin and Child flanked by two angels; it is from the west facade of Notre-Dame de Paris, though a detail this narrow makes a confident identification difficult.",
     required_points: [Gothic rose window with statues, Notre-Dame or an appropriately hedged answer], avoid: [Overconfident identification of a different cathedral]}
  - {id: L-sp, location: st-pauls, type: landmark_identification, difficulty: moderate, images: [sp_millennium_bridge], question: q_identify,
     answer: "St Paul's Cathedral in London: a large colonnaded drum and dome with lantern, in black and white, above the Millennium Bridge in the foreground.",
     required_points: [St Paul's Cathedral], avoid: ["St Peter's Basilica", US Capitol]}
  - {id: L-fk-ruin, location: frauenkirche, type: landmark_identification, difficulty: hard, answerable: false, action: decline,
     images: [fk_1973_ruin], question: q_identify,
     answer: "The image shows a ruined sandstone structure with arched openings standing above a mound of rubble. A specific identification is not established by the image alone (it is in fact the ruin of the Dresden Frauenkirche).",
     required_points: [Describes the ruin, Declines or clearly hedges the identification], avoid: [A confident identification]}

  # ===================== spatial_reasoning =====================
  - id: S-north-coords
    location: paris-rome-spatial
    type: spatial_reasoning
    difficulty: moderate
    images: [et_2009_full, co_panorama]
    question: "Which of the two pictured landmarks is farther north? Use only the supplied coordinates."
    evidence: "Landmark in Image A: 48.8584 N, 2.2945 E. Landmark in Image B: 41.8902 N, 12.4922 E."
    answer: "The landmark in Image A is farther north (48.86 N versus 41.89 N)."
    required_points: [Image A, Uses the supplied latitudes]
    avoid: [Reasoning from apparent size or recognition alone]

  - id: S-north-nocoords
    location: eiffel
    type: spatial_reasoning
    difficulty: hard
    answerable: false
    action: use_tools
    images: [et_2011_champ_de_mars, co_forum]
    question: "Which of these two landmarks is farther north? Answer only from verified coordinates; do not rely on recognition or general knowledge."
    answer: "No coordinates are supplied, so this cannot be answered from the images. It needs geocoding or a coordinate lookup (with them, the Eiffel Tower in Image A is farther north than the Colosseum)."
    required_points: [Declines or requests coordinates]
    avoid: [An unqualified answer based on recognition]

  - id: S-distance
    location: istanbul
    type: spatial_reasoning
    difficulty: hard
    answerable: false
    action: use_tools
    images: [hs_2013_a, sam_2022]
    question: "Approximately how far apart are these two buildings, in metres? Do not estimate from apparent size in the photos."
    answer: "The images do not establish the distance; coordinates or a map are needed."
    required_points: [Declines or requests coordinates or a map]
    avoid: [A numeric estimate from the photos]

  - id: S-left-right
    location: westminster
    type: spatial_reasoning
    difficulty: easy
    images: [wm_2025_river]
    question: "In this photo, is the clock tower at the left end or the right end of the long riverside building?"
    answer: "At the right end. The larger square tower stands at the left end."
    required_points: [Right]
    avoid: []

  - id: S-distance-coords
    location: berlin
    type: spatial_reasoning
    difficulty: moderate
    action: use_tools
    images: [bt_2019_a, rt_2021_inscription]
    question: "How far apart are the two pictured landmarks? Use the supplied coordinates and show the calculation."
    evidence: "Landmark in Image A: 52.5163 N, 13.3777 E. Landmark in Image B: 52.5186 N, 13.3762 E."
    answer: "About 275 m (roughly 0.0023 degrees of latitude, about 256 m, and 0.0015 degrees of longitude, about 102 m at this latitude)."
    required_points: [Approximately 250-300 m, Uses the coordinates]
    avoid: [Estimating from the photos]

  # ===================== factual_retrieval =====================
  - {id: F-rt-inscription, location: berlin, type: factual_retrieval, difficulty: easy, images: [rt_2021_inscription],
     question: "What does the inscription above the entrance say?",
     answer: "DEM DEUTSCHEN VOLKE", required_points: [DEM DEUTSCHEN VOLKE], avoid: []}
  - {id: F-pa-inscription, location: pantheon, type: factual_retrieval, difficulty: easy, images: [pa_portico],
     question: "What does the inscription on the frieze say?",
     answer: "M·AGRIPPA·L·F·COS·TERTIVM·FECIT", required_points: [M AGRIPPA L F COS TERTIVM FECIT], avoid: []}
  - {id: F-sf-architect, location: sagrada-familia, type: factual_retrieval, difficulty: hard, answerable: false, action: use_tools,
     images: [sf_2022_tall], question: "Who designed this building? Use only the image.",
     answer: "The architect is not shown in the image; this needs an external record (records name Antoni Gaudí).",
     required_points: [States that the image does not establish the architect], avoid: [An unqualified name presented as visible fact]}
  - {id: F-fi-year, location: flatiron, type: factual_retrieval, difficulty: hard, answerable: false, action: decline,
     images: [fi_1903], question: "In what year was this photograph taken?",
     answer: "The image does not establish a year. Horse-drawn vehicles and the photographic style suggest an early-20th-century date, but an exact year needs a record.",
     required_points: [Does not give an exact year as fact], avoid: [A specific year presented as certain]}
  - {id: F-nd-why, location: notre-dame, type: factual_retrieval, difficulty: moderate, answerable: false, action: use_tools,
     images: [nd_2020_works], question: "Why is there construction work at this building?",
     answer: "The image shows a crane and works around the cathedral and no central spire, but it does not show why; the reason needs an external source.",
     required_points: [Describes what is visible, Does not assert the cause], avoid: [Asserting the cause as visible fact]}
